<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>실전 시뮬레이터 · TEF Atelier</title>
<style>
  :root{
    --paper:#f6f3ec; --surface:#fffdf8; --ink:#1f2925; --muted:#66706b;
    --line:#ddd8cc; --gold:#b97a17; --gold-soft:#f3e7c8;
    --green:#19724a; --green-soft:#e2f1e7; --red:#b9483d; --red-soft:#f7e5e2;
    --serif:Georgia,'Times New Roman','Noto Serif KR',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; min-height:100dvh; color:var(--ink);
    background:radial-gradient(circle at 18% 0%, rgba(235,221,183,.42), transparent 30rem), var(--paper);
    font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:26px 20px calc(28px + env(safe-area-inset-bottom));
  }
  button{font:inherit; touch-action:manipulation; cursor:pointer;}
  .wrap{max-width:560px; margin:0 auto;}
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
  .mono{
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:24px; color:var(--gold);
    background:var(--ink); border:1px solid var(--gold);
  }
  .brand h1{font-family:var(--serif); font-size:21px; margin:0; letter-spacing:.5px;}
  .brand h1 small{display:block; font-family:inherit; font-size:12px; color:var(--muted); letter-spacing:2px; font-weight:400;}
  .sub{text-align:center; color:var(--muted); font-size:13px; margin:0 0 22px;}
  .screen{display:none;}
  .screen.on{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 6px 22px rgba(31,41,37,.07); padding:20px; margin-bottom:14px;
  }
  .sec-title{font-size:13px; font-weight:700; letter-spacing:1.5px; color:var(--muted); margin:0 0 10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:9px 14px; font-size:14px; font-weight:600;
  }
  .chip small{font-weight:400; color:var(--muted); margin-left:4px;}
  .chip.sel{border-color:var(--gold); background:var(--gold-soft); color:var(--ink);}
  .best-line{text-align:center; font-size:13px; color:var(--muted); margin:2px 0 14px; min-height:18px;}
  .best-line b{color:var(--gold);}
  .start-btn{
    width:100%; padding:16px; border:none; border-radius:16px; font-size:17px; font-weight:800;
    color:#fffdf8; background:linear-gradient(135deg,#2a3a34,#1f2925);
    border:1px solid var(--gold); box-shadow:0 8px 24px rgba(185,122,23,.25);
  }
  .start-btn:active{transform:scale(.98);}
  /* quiz */
  .hud{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .hud b{color:var(--ink);}
  .timer-track{height:8px; border-radius:99px; background:#e9e2d2; overflow:hidden; margin-bottom:16px;}
  .timer-bar{height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),#d9a441); transition:width .1s linear;}
  .timer-bar.low{background:linear-gradient(90deg,var(--red),#d4695c);}
  .q-tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--gold);
    border:1px solid var(--gold); border-radius:99px; padding:3px 10px; margin-bottom:10px;}
  .q-prompt{font-family:var(--serif); font-size:34px; text-align:center; margin:6px 0 4px; line-height:1.35; word-break:keep-all;}
  .q-prompt.ko{font-family:inherit; font-weight:800; font-size:30px;}
  .q-hint{text-align:center; color:var(--muted); font-size:13px; margin:0 0 18px;}
  .choices{display:grid; gap:10px;}
  .choice{
    text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
    padding:15px 16px; font-size:16px; line-height:1.4; display:flex; gap:12px; align-items:center;
  }
  .choice .n{
    flex:none; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted);
  }
  .choice.correct{background:var(--green-soft); border-color:var(--green);}
  .choice.correct .n{background:var(--green); border-color:var(--green); color:#fff;}
  .choice.wrong{background:var(--red-soft); border-color:var(--red);}
  .choice.wrong .n{background:var(--red); border-color:var(--red); color:#fff;}
  .choice.dim{opacity:.55;}
  .flash-msg{text-align:center; font-weight:800; font-size:15px; min-height:24px; margin-top:12px;}
  .flash-msg.ok{color:var(--green);} .flash-msg.no{color:var(--red);}
  /* result */
  .score-hero{text-align:center; padding:10px 0 4px;}
  .score-num{font-family:var(--serif); font-size:64px; color:var(--gold); line-height:1;}
  .score-num small{font-size:22px; color:var(--muted);}
  .score-stats{display:flex; justify-content:center; gap:22px; margin:14px 0 6px; font-size:13px; color:var(--muted);}
  .score-stats b{display:block; font-size:19px; color:var(--ink);}
  .record-badge{
    display:inline-block; margin-top:8px; padding:6px 14px; border-radius:99px; font-size:13px; font-weight:800;
    background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold);
  }
  .wrong-list{margin:6px 0 0; padding:0; list-style:none; max-height:260px; overflow:auto;}
  .wrong-list li{padding:10px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
  .wrong-list .fr{font-family:var(--serif); font-weight:700;}
  .wrong-list .ko{color:var(--muted);}
  .wrong-list .arrow{color:var(--gold); margin:0 6px;}
  .btn-row{display:grid; gap:10px; margin-top:14px;}
  .btn{
    padding:14px; border-radius:14px; font-size:15px; font-weight:700;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .btn.primary{background:linear-gradient(135deg,#2a3a34,#1f2925); color:#fffdf8; border:1px solid var(--gold);}
  .btn:active{transform:scale(.98);}
  .foot{text-align:center; margin-top:18px;}
  .foot a{color:var(--muted); font-size:13px; text-decoration:none; border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mono">A</div>
    <h1>TEF Atelier<small>EXAM SIMULATOR</small></h1>
  </div>
  <p class="sub">화요일 과외 단어시험 대비 · 실전처럼, 시간 재고 풀기</p>

  <!-- SETUP -->
  <section id="setup" class="screen on">
    <div class="card">
      <p class="sec-title">덱 선택</p>
      <div class="chips" id="deckChips"></div>
    </div>
    <div class="card">
      <p class="sec-title">문제 수</p>
      <div class="chips" id="countChips"></div>
    </div>
    <div class="card">
      <p class="sec-title">문제당 제한시간</p>
      <div class="chips" id="timeChips"></div>
    </div>
    <div class="card">
      <p class="sec-title">출제 방향</p>
      <div class="chips" id="dirChips"></div>
    </div>
    <p class="best-line" id="bestLine"></p>
    <button class="start-btn" id="startBtn">시험 시작</button>
    <div class="foot"><a href="index.html">← 단어장으로 돌아가기</a></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="hud">
      <span><b id="qProg">1</b> / <span id="qTotal">20</span></span>
      <span>맞춤 <b id="qScore">0</b></span>
      <span id="qClock"></span>
    </div>
    <div class="timer-track" id="timerTrack"><div class="timer-bar" id="timerBar"></div></div>
    <div class="card">
      <div style="text-align:center"><span class="q-tag" id="qTag">A1·A2</span></div>
      <div class="q-prompt" id="qPrompt">—</div>
      <p class="q-hint" id="qHint">뜻을 고르세요</p>
      <div class="choices" id="choices"></div>
      <div class="flash-msg" id="flashMsg"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="card score-hero">
      <p class="sec-title" id="rTitle">시험 결과</p>
      <div class="score-num"><span id="rScore">0</span><small> / 100</small></div>
      <div id="rBadge"></div>
      <div class="score-stats">
        <span>맞춘 문제<b id="rCorrect">0</b></span>
        <span>정답률<b id="rRate">0%</b></span>
        <span>평균 응답<b id="rAvg">0초</b></span>
      </div>
    </div>
    <div class="card" id="wrongCard" style="display:none">
      <p class="sec-title">틀린 문제 복습</p>
      <ul class="wrong-list" id="wrongList"></ul>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="retryWrongBtn" style="display:none">틀린 문제만 다시 풀기</button>
      <button class="btn" id="retryBtn">같은 조건으로 다시 도전</button>
      <button class="btn" id="homeBtn">처음으로</button>
    </div>
    <div class="foot"><a href="index.html">← 단어장으로 돌아가기</a></div>
  </section>
</div>

/* ============ 효과음 (WebAudio 합성, 파일 없음) ============ */
let AC=null;
function tone(freq, t0, dur, vol){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(vol, AC.currentTime+t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+0.05);
  }catch(e){}
}

/* ============ 설정 화면 ============ */
function chipGroup(el, items, cur, fmt, onPick){
  el.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.className="chip"+(it.v===cur||it.id===cur?" sel":"");
    b.innerHTML=fmt(it);
    b.onclick=()=>{ onPick(it.v!==undefined?it.v:it.id); chipGroup(el,items,it.v!==undefined?it.v:it.id,fmt,onPick); refreshBest(); };
    el.appendChild(b);
  });
}
function deckCount(id){ const d=DECKS.find(x=>x.id===id); return CARDS.filter(d.test).length; }
function refreshBest(){
  const best=getBest()[S.deck+"_"+S.dir];
  const deck=DECKS.find(d=>d.id===S.deck);
  const pool=CARDS.filter(deck.test);
  const done=pool.filter(c=>TESTED[c.i]).length;
  const cov = done>=pool.length
    ? `🏆 <b>이 덱 정복 완료!</b>`
    : `출제 이력 ${done.toLocaleString()} / ${pool.length.toLocaleString()}장 · 안 푼 카드부터 출제돼요`;
  $("bestLine").innerHTML = (best!=null?`최고 <b>${best}점</b> · `:"")
    + cov + ` · <a href="#" id="resetTested" style="color:var(--muted)">기록 지우기</a>`;
  $("resetTested").onclick=e=>{ e.preventDefault();
    if(confirm("출제 기록을 모두 지울까요?")){ TESTED={}; saveTested(TESTED); refreshBest(); } };
}

  chipGroup($("countChips"), COUNTS.map(v=>({v})), S.count, c=>`${c.v}문제`, v=>S.count=v);
  chipGroup($("timeChips"), TIMES, S.time, t=>t.label, v=>S.time=v);
  chipGroup($("dirChips"), DIRS, S.dir, d=>d.label, v=>S.dir=v);
  refreshBest();
  $("startBtn").onclick=startExam;
}

/* ============ 시험 ============ */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQuestions(pool, n){
  /* 안 푼 카드 우선 → 다 풀었으면 푼 카드에서 셔플 */
  const untested = shuffle(pool.filter(c=>!TESTED[c.i]));
  const testedAgain = shuffle(pool.filter(c=>TESTED[c.i]));
  const picked = untested.concat(testedAgain).slice(0, Math.min(n, pool.length));
  return picked.map(card=>{
    const key = S.dir==="fr-ko" ? "k" : "f";
    const seen = new Set([card[key]]);
    const distract = shuffle(pool.filter(c=>c!==card && !seen.has(c[key]))).slice(0,60);
    const opts=[];
    for(const d of distract){ if(opts.length>=3) break; if(seen.has(d[key])) continue; seen.add(d[key]); opts.push(d); }
    while(opts.length<3){ // 보기 부족 시 전체에서 보충
      const d=pool[Math.floor(Math.random()*pool.length)];
      if(d && !seen.has(d[key])){ seen.add(d[key]); opts.push(d); }
      else break;
    }
    return { card, opts:shuffle([card, ...opts]) };
  });
}
function startExam(customPool){
  const deck=DECKS.find(d=>d.id===S.deck);
  /* 버튼 클릭 시 브라우저가 이벤트 객체를 첫 인자로 넘기므로 배열인지 반드시 확인 */
  const pool=(Array.isArray(customPool)?customPool:CARDS.filter(deck.test));
  if(pool.length<4){ alert("이 덱의 문제 수가 부족해요."); return; }
  TESTED=getTested(); /* 다른 탭에서 쌓인 기록 반영 */
  S.qs=buildQuestions(pool,S.count); S.idx=0; S.correct=0; S.wrong=[]; S.times=[];
  show("quiz"); renderQ();
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo(0,0);
}
function renderQ(){
  const q=S.qs[S.idx], card=q.card;
  S.locked=false;
  $("qProg").textContent=S.idx+1; $("qTotal").textContent=S.qs.length;
  $("qScore").textContent=S.correct;
  $("qTag").textContent=lexLabel(card.l)+" · "+card.i;
  const prompt=$("qPrompt"), hint=$("qHint");
  if(S.dir==="fr-ko"){ prompt.textContent=card.f; prompt.classList.remove("ko"); hint.textContent="뜻을 고르세요"; }
  else{ prompt.textContent=card.k; prompt.classList.add("ko"); hint.textContent="불어 단어를 고르세요"; }
  const box=$("choices"); box.innerHTML="";
  const key=S.dir==="fr-ko"?"k":"f";
  const labels=["A","B","C","D"];
  q.opts.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<span class="n">${labels[i]}</span><span>${opt[key]}</span>`;
    b.onclick=()=>answer(opt===card, b, q);
    box.appendChild(b);
  });
  $("flashMsg").textContent=""; $("flashMsg").className="flash-msg";
  startTimer();
}
function startTimer(){
  cancelAnimationFrame(S.raf);
  const bar=$("timerBar"), track=$("timerTrack"), clock=$("qClock");
  if(!S.time){ track.style.display="none"; clock.textContent=""; return; }
  track.style.display=""; bar.classList.remove("low");
  S.t0=performance.now(); S.deadline=S.time*1000;
  const step=now=>{
    if(S.locked) return;
    const el=now-S.t0, left=Math.max(0,S.deadline-el);
    bar.style.width=(left/S.deadline*100)+"%";
    const s=Math.ceil(left/1000);
    clock.textContent="⏱ "+s+"초";
    if(left<=3000) bar.classList.add("low");
    if(left<=0){ timeoutQ(); return; }
    S.raf=requestAnimationFrame(step);
  };
  S.raf=requestAnimationFrame(step);
}
function stopTimer(){ cancelAnimationFrame(S.raf); }
function markChoices(q){
  const key=S.dir==="fr-ko"?"k":"f";
  [...$("choices").children].forEach((b,i)=>{
    b.onclick=null;
    if(q.opts[i]===q.card) b.classList.add("correct");
    else b.classList.add("dim");
  });
}
function answer(ok, btn, q){
  if(S.locked) return; S.locked=true; stopTimer();
  const dt=(performance.now()-S.t0)/1000;
  S.times.push(S.time?Math.min(dt,S.time):dt);
  markTested(q.card.i);
  markChoices(q);
  const msg=$("flashMsg");
  if(ok){ S.correct++; sfxOK(); msg.textContent="정답!"; msg.classList.add("ok"); $("qScore").textContent=S.correct; }
  else{ btn.classList.remove("dim"); btn.classList.add("wrong"); sfxNo(); S.wrong.push(q.card); msg.textContent="땡! 정답을 확인하세요"; msg.classList.add("no"); }
  setTimeout(nextQ, ok?750:1600);
}
function timeoutQ(){
  if(S.locked) return; S.locked=true;
  const q=S.qs[S.idx];
  S.times.push(S.time); S.wrong.push(q.card);
  markTested(q.card.i);
  markChoices(q);
  const msg=$("flashMsg");
  msg.textContent="시간 초과! 정답을 확인하세요"; msg.classList.add("no");
  sfxNo();
  setTimeout(nextQ, 1600);
}
function nextQ(){
  S.idx++;
  if(S.idx>=S.qs.length) finishExam();
  else renderQ();
}

/* ============ 결과 ============ */
function finishExam(){
  stopTimer(); sfxEnd();
  const total=S.qs.length, score=Math.round(S.correct/total*100);
  const avg=S.times.length?(S.times.reduce((a,b)=>a+b,0)/S.times.length):0;
  $("rTitle").textContent = `${DECKS.find(d=>d.id===S.deck).label} · ${S.count}문제 결과`;
  $("rScore").textContent=score;
  $("rCorrect").textContent=`${S.correct} / ${total}`;
  $("rRate").textContent=Math.round(S.correct/total*100)+"%";
  $("rAvg").textContent=avg.toFixed(1)+"초";
  const bk=S.deck+"_"+S.dir, best=getBest();
  const isRecord = best[bk]==null || score>best[bk];
  if(isRecord){ best[bk]=score; setBest(best); }
  $("rBadge").innerHTML = isRecord ? `<span class="record-badge">🏆 최고 기록 경신!</span>` : "";
  const wc=$("wrongCard"), wl=$("wrongList");
  if(S.wrong.length){
    wc.style.display="";
    wl.innerHTML="";
    S.wrong.forEach(c=>{
      const li=document.createElement("li");
      li.innerHTML=`<span class="fr">${c.f}</span><span class="arrow">→</span><span class="ko">${c.k}</span>`;
      wl.appendChild(li);
    });
    $("retryWrongBtn").style.display="";
  }else{
    wc.style.display="none"; $("retryWrongBtn").style.display="none";
    wl.innerHTML="";
  }
  $("retryWrongBtn").onclick=()=>startExam(S.wrong.slice());
  $("retryBtn").onclick=()=>startExam();
  $("homeBtn").onclick=()=>{ initSetup(); show("setup"); };
  show("result");
}

document.addEventListener("DOMContentLoaded", initSetup);
</script>
