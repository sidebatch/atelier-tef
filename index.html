<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <title>TEF 5시간 암기</title>
  <style>
    :root {
      --paper: #f6f3ec;
      --surface: #fffdf8;
      --ink: #1f2925;
      --muted: #66706b;
      --line: #ddd8cc;
      --green: #19724a;
      --green-soft: #e2f1e7;
      --red: #b9483d;
      --red-soft: #f7e5e2;
      --amber: #b97a17;
      --shadow: 0 18px 50px rgba(36, 43, 39, .10);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% 0%, rgba(235, 221, 183, .42), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select { font: inherit; touch-action: manipulation; }
    button { color: inherit; }

    .app {
      width: min(980px, 100%);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--ink); color: white;
      font-weight: 850; letter-spacing: -.04em;
      box-shadow: 0 6px 15px rgba(31, 41, 37, .18);
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: clamp(18px, 3vw, 22px); letter-spacing: -.035em; }
    .subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .header-actions { display: flex; gap: 7px; }
    .icon-btn, .pill, .mode-btn, .reveal-btn, .grade, .next-btn {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .82);
      border-radius: 12px;
      cursor: pointer;
      transition: transform .12s ease, background .15s ease, border-color .15s ease;
    }
    button:active { transform: scale(.98); }
    button:focus-visible, select:focus-visible { outline: 3px solid rgba(25, 114, 74, .24); outline-offset: 2px; }
    .icon-btn { padding: 9px 11px; font-size: 13px; white-space: nowrap; }
    .icon-btn:hover { background: white; border-color: #c8c1b2; }

    .stats {
      display: grid;
      grid-template-columns: 1.7fr repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .75);
      border-radius: 14px;
      padding: 11px 13px;
      min-width: 0;
    }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-value { margin-top: 3px; font-size: 18px; font-weight: 850; letter-spacing: -.03em; }
    .stat-value .small { font-size: 12px; font-weight: 650; color: var(--muted); }
    .progress-track { height: 5px; margin-top: 8px; border-radius: 99px; background: #e7e1d5; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--green); transition: width .25s ease; }
    .green { color: var(--green); }
    .red { color: var(--red); }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .7);
      border-radius: 13px;
    }
    .mode-btn { border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 750; color: var(--muted); }
    .mode-btn.active { background: var(--ink); color: white; box-shadow: 0 3px 8px rgba(31, 41, 37, .15); }
    .right-controls { display: flex; align-items: center; gap: 7px; }
    select, .pill { min-height: 38px; padding: 0 11px; color: var(--ink); font-weight: 700; font-size: 13px; }
    select { border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .pill { display: inline-flex; align-items: center; gap: 7px; }
    .pill strong { color: var(--green); }

    main { flex: 1; display: grid; place-items: center; min-height: 420px; }
    .study { width: min(680px, 100%); }
    .queue-note {
      margin: 0 4px 8px;
      display: flex; justify-content: space-between; gap: 12px;
      color: var(--muted); font-size: 12px; font-weight: 650;
    }
    .card {
      min-height: 360px;
      padding: 24px clamp(22px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 25px;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: var(--green); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .source { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
    .pronounce-btn {
      min-height: 50px;
      margin-top: 20px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #c9d9cf;
      border-radius: 15px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 15px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(25, 114, 74, .09);
    }
    .pronounce-btn:hover { border-color: #9fc5ad; background: #d8ecdf; }
    .answer .pronounce-btn { margin-top: 16px; }
    .streak { display: flex; gap: 5px; align-items: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ded8cb; }
    .dot.on { background: var(--green); }
    .prompt-wrap { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px 0; }
    .direction-label { margin-bottom: 13px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .prompt { max-width: 100%; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 7vw, 56px); line-height: 1.12; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .prompt.korean { font-family: inherit; font-size: clamp(28px, 6vw, 48px); font-weight: 820; }
    .hint-missing { margin-top: 10px; font-size: 12px; color: var(--amber); font-weight: 750; }
    .answer {
      width: 100%;
      display: none;
      border-top: 1px solid var(--line);
      padding: 22px 0 2px;
      text-align: center;
      animation: rise .16s ease-out;
    }
    .card.revealed .answer { display: block; }
    .answer-main { font-size: clamp(24px, 5vw, 38px); font-weight: 850; letter-spacing: -.025em; line-height: 1.25; }
    .answer-main.french { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
    .answer-en { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .answer-note { margin-top: 7px; color: var(--amber); font-size: 12px; font-weight: 700; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } }

    .actions { margin-top: 12px; }
    .reveal-btn { width: 100%; min-height: 56px; background: var(--ink); color: white; border-color: var(--ink); font-weight: 820; font-size: 16px; }
    .grade-row { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
    .revealed-actions .reveal-btn { display: none; }
    .revealed-actions .grade-row { display: grid; }
    .grade { min-height: 58px; font-weight: 850; font-size: 17px; }
    .grade small { display: block; margin-top: 2px; font-size: 10px; font-weight: 650; opacity: .76; }
    .wrong { background: var(--red-soft); color: var(--red); border-color: #eccac5; }
    .right { background: var(--green-soft); color: var(--green); border-color: #c3dfcc; }
    .shortcut { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: 11px; }

    .empty {
      width: min(620px, 100%); padding: 40px 28px; text-align: center;
      border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow);
    }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 15px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 25px; }
    .empty h2 { margin: 0 0 8px; font-size: 24px; }
    .empty p { margin: 0 auto 20px; max-width: 430px; color: var(--muted); line-height: 1.55; }
    .next-btn { padding: 12px 18px; background: var(--ink); color: white; border-color: var(--ink); font-weight: 800; }

    dialog {
      width: min(720px, calc(100% - 28px)); max-height: min(760px, calc(100dvh - 30px));
      padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 70px rgba(30, 35, 32, .25);
    }
    dialog::backdrop { background: rgba(25, 31, 28, .42); backdrop-filter: blur(4px); }
    .modal-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; background: rgba(255, 253, 248, .96); border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 19px; }
    .modal-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 10px 20px 20px; overflow: auto; }
    .hard-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid #ece7dd; }
    .hard-row:last-child { border-bottom: 0; }
    .hard-fr { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; }
    .hard-ko { margin-top: 3px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .hard-count { min-width: 48px; padding: 6px 9px; border-radius: 9px; background: var(--red-soft); color: var(--red); text-align: center; font-size: 12px; font-weight: 850; }
    .modal-empty { padding: 36px 0; text-align: center; color: var(--muted); }
    .modal-foot { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 13px 20px; border-top: 1px solid var(--line); background: rgba(255, 253, 248, .96); }

    .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 16px); padding: 10px 14px; border-radius: 11px; background: var(--ink); color: white; font-size: 13px; font-weight: 750; opacity: 0; pointer-events: none; transition: .2s ease; box-shadow: 0 10px 30px rgba(31, 41, 37, .2); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 680px) {
      .app { padding-left: 14px; padding-right: 14px; gap: 12px; }
      .subtitle { display: none; }
      .header-actions .reset-label { display: none; }
      .stats { grid-template-columns: 1.5fr repeat(3, 1fr); }
      .stat { padding: 9px 8px; }
      .stat-label { font-size: 9px; }
      .stat-value { font-size: 16px; }
      .stat-value .small { display: none; }
      .controls { align-items: stretch; }
      .segmented { width: 100%; }
      .mode-btn { flex: 1; padding-left: 6px; padding-right: 6px; }
      .right-controls { width: 100%; justify-content: space-between; }
      .pill { flex: 1; justify-content: center; }
      main { min-height: 400px; }
      .card { min-height: 330px; padding: 20px; border-radius: 21px; }
    }

    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">TEF</div>
        <div>
          <h1>5시간 어휘 암기</h1>
          <div class="subtitle">답을 떠올린 뒤 공개하고, 2초 안에 안 나오면 X</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="hardBtn" type="button">어려운 카드 <strong id="hardBadge">0</strong></button>
        <button class="icon-btn" id="resetBtn" type="button" aria-label="전체 초기화">↺ <span class="reset-label">초기화</span></button>
      </div>
    </header>

    <section class="stats" aria-label="학습 통계">
      <div class="stat">
        <div class="stat-label">현재 방향 완료</div>
        <div class="stat-value"><span id="doneCount">0</span><span class="small"> / 500</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="stat"><div class="stat-label">오늘 O</div><div class="stat-value green" id="correctCount">0</div></div>
      <div class="stat"><div class="stat-label">오늘 오답</div><div class="stat-value red" id="wrongCount">0</div></div>
      <div class="stat"><div class="stat-label">남은 카드</div><div class="stat-value" id="remainingCount">500</div></div>
    </section>

    <section class="controls" aria-label="학습 설정">
      <div class="segmented" id="modeTabs">
        <button class="mode-btn active" data-mode="all" type="button">전체 500</button>
        <button class="mode-btn" data-mode="session" type="button">25개 세션</button>
        <button class="mode-btn" data-mode="hard" type="button">오답만</button>
      </div>
      <div class="right-controls">
        <select id="sessionSelect" aria-label="25개 세션 선택" hidden></select>
        <button class="pill" id="directionBtn" type="button" aria-label="학습 방향 전환">
          <span id="directionText">FR</span> <span>→</span> <strong id="answerDirectionText">KR</strong>
        </button>
      </div>
    </section>

    <main id="main"></main>
  </div>

  <dialog id="hardDialog">
    <div class="modal-head">
      <div><h2>어려운 카드</h2><p>X 누른 횟수가 많은 순서입니다.</p></div>
      <button class="icon-btn" id="closeHardBtn" type="button">닫기</button>
    </div>
    <div class="modal-body" id="hardList"></div>
    <div class="modal-foot">
      <button class="icon-btn" id="studyHardBtn" type="button">오답만 학습</button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CARDS = [{"id":"L1-001","lexique":1,"number":1,"fr":"avoir besoin de","en":"to need","ko":"필요하다"},{"id":"L1-002","lexique":1,"number":2,"fr":"avoir envie de","en":"to want","ko":"-을 갖고 싶다"},{"id":"L1-003","lexique":1,"number":3,"fr":"avoir peur de","en":"to be afraid of","ko":"두렵다"},{"id":"L1-004","lexique":1,"number":4,"fr":"avoir raison (de)","en":"to be right (to)","ko":"-하는 것은 옳다"},{"id":"L1-005","lexique":1,"number":5,"fr":"avoir tort (de)","en":"to be wrong (to)","ko":"-하는 것은 나쁘다"},{"id":"L1-006","lexique":1,"number":6,"fr":"avoir de la chance","en":"to be lucky","ko":"운이 좋다"},{"id":"L1-007","lexique":1,"number":7,"fr":"avoir l'air (de)","en":"to look (like)","ko":"-처럼 보인다"},{"id":"L1-008","lexique":1,"number":8,"fr":"avoir l'intention de","en":"to intend to","ko":"-할 작정이다"},{"id":"L1-009","lexique":1,"number":9,"fr":"avoir confiance (en)","en":"to trust (in)","ko":"-을 믿다"},{"id":"L1-010","lexique":1,"number":10,"fr":"avoir le temps de","en":"to have time to","ko":"-할 시간이 있다"},{"id":"L1-011","lexique":1,"number":11,"fr":"avoir l'occasion de","en":"to have the opportunity to","ko":"-할 기회를 갖다"},{"id":"L1-012","lexique":1,"number":12,"fr":"avoir (du) mal à","en":"to have difficulty (doing)","ko":"-하는 것을 잘 못하다"},{"id":"L1-013","lexique":1,"number":13,"fr":"avoir mal à","en":"to hurt (in)","ko":"-가 아프다"},{"id":"L1-014","lexique":1,"number":14,"fr":"avoir lieu","en":"to take place","ko":"일어나다"},{"id":"L1-015","lexique":1,"number":15,"fr":"avoir hâte de","en":"to be eager to","ko":"빨리 -하고 싶다"},{"id":"L1-016","lexique":1,"number":16,"fr":"avoir l'habitude de","en":"to be used to","ko":"-하는 습관이 있다"},{"id":"L1-017","lexique":1,"number":17,"fr":"faire partie de","en":"to be part of","ko":"-에 속하다"},{"id":"L1-018","lexique":1,"number":18,"fr":"faire les courses","en":"to do the shopping","ko":"장을 보다"},{"id":"L1-019","lexique":1,"number":19,"fr":"faire des achats","en":"to go shopping","ko":"쇼핑하다"},{"id":"L1-020","lexique":1,"number":20,"fr":"faire la queue","en":     const STORAGE_KEY = "tef-5hour-vocab-v1";
    const SCHEMA_VERSION = 3;
    const MASTERY = 3;
    const SESSION_SIZE = 25;
    const TODAY = new Date().toLocaleDateString("en-CA");
    let revealed = false;
    let toastTimer;
    let onlineFrenchAudio = null;

    const $ = (selector) => document.querySelector(selector);
    const main = $("#main");

    function freshState() {
      return { version: SCHEMA_VERSION, date: TODAY, direction: "fr-ko", mode: "all", session: 1, daily: { o: 0, x: 0, wrongIds: [] }, progress: {}, queues: {} };
    }

    function loadState() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (_) { saved = null; }
      const next = saved || freshState();
      const sameStudyDay = next.date === TODAY;
      const migratingWrongCount = next.version !== SCHEMA_VERSION;
      if (migratingWrongCount) {
        next.version = SCHEMA_VERSION;
        next.queues = {};
      }
      if (next.date !== TODAY) {
        next.date = TODAY;
        next.daily = { o: 0, x: 0, wrongIds: [] };
      }
      next.daily ||= { o: 0, x: 0, wrongIds: [] };
      next.daily.wrongIds ||= [];
      next.progress ||= {};
      next.queues ||= {};
      for (const card of CARDS) {
        next.progress[card.id] ||= {};
        next.progress[card.id]["fr-ko"] ||= { streak: 0, o: 0, x: 0 };
        next.progress[card.id]["ko-fr"] ||= { streak: 0, o: 0, x: 0 };
      }
      if (migratingWrongCount && sameStudyDay) {
        next.daily.wrongIds = CARDS.filter(card => {
          const progress = next.progress[card.id];
          return progress["fr-ko"].x + progress["ko-fr"].x > 0;
        }).map(card => card.id);
      }
      next.daily.x = next.daily.wrongIds.length;
      return next;
    }

    let state = loadState();

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (_) { showToast("진행 저장에 실패했습니다."); }
    }

    function progressOf(id, direction = state.direction) { return state.progress[id][direction]; }
    function isMastered(id, direction = state.direction) { return progressOf(id, direction).streak >= MASTERY; }
    function wrongTotal(id) { return progressOf(id, "fr-ko").x + progressOf(id, "ko-fr").x; }

    function scopeCards() {
      if (state.mode === "session") {
        const start = (state.session - 1) * SESSION_SIZE;
        return CARDS.slice(start, start + SESSION_SIZE);
      }
      if (state.mode === "hard") return CARDS.filter(card => wrongTotal(card.id) > 0);
      return CARDS;
    }

    function queueKey() { return `${state.direction}:${state.mode}:${state.mode === "session" ? state.session : "-"}`; }

    function getQueue() {
      const key = queueKey();
      const allowed = new Set(scopeCards().map(card => card.id));
      let queue = Array.isArray(state.queues[key]) ? state.queues[key] : [];
      queue = queue.filter((id, index) => allowed.has(id) && !isMastered(id) && queue.indexOf(id) === index);
      const queued = new Set(queue);
      for (const card of scopeCards()) {
        if (!isMastered(card.id) && !queued.has(card.id)) queue.push(card.id);
      }
      state.queues[key] = queue;
      return queue;
    }

    function setQueue(queue) { state.queues[queueKey()] = queue; }

    function showToast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function bindTap(target, handler) {
      target.addEventListener("click", handler);
      target.addEventListener("touchend", event => {
        event.preventDefault();
        handler(event);
      }, { passive: false });
    }

    function renderStats() {
      const done = CARDS.filter(card => isMastered(card.id)).length;
      $("#doneCount").textContent = done;
      $("#remainingCount").textContent = CARDS.length - done;
      $("#correctCount").textContent = state.daily.o;
      $("#wrongCount").textContent = state.daily.x;
      $("#progressFill").style.width = `${(done / CARDS.length) * 100}%`;
      const hard = CARDS.filter(card => wrongTotal(card.id) > 0).length;
      $("#hardBadge").textContent = hard;
    }

    function renderControls() {
      document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.mode === state.mode));
      const sessionSelect = $("#sessionSelect");
      sessionSelect.hidden = state.mode !== "session";
      sessionSelect.value = String(state.session);
      const reverse = state.direction === "ko-fr";
      $("#directionText").textContent = reverse ? "KR" : "FR";
      $("#answerDirectionText").textContent = reverse ? "FR" : "KR";
    }

    function cardMarkup(card, queueLength) {
      const reverse = state.direction === "ko-fr";
      const p = progressOf(card.id);
      const missingKorean = !card.ko;
      const prompt = reverse ? (card.ko || card.en) : card.fr;
      const answer = reverse ? card.fr : (card.ko || card.en);
      const directionLabel = reverse ? "한국어를 보고 프랑스어 회상" : "프랑스어를 보고 한국어 회상";
      const scoped = scopeCards();
      const scopeDone = scoped.filter(item => isMastered(item.id)).length;
      return `
        <div class="study">
          <div class="queue-note"><span>${state.mode === "session" ? `세션 ${state.session} · ${scopeDone}/${scoped.length} 완료` : state.mode === "hard" ? `오답 ${scoped.length}개 집중` : "전체 범위"}</span><span>대기 ${queueLength}장</span></div>
          <article class="card${revealed ? " revealed" : ""}" id="flashcard" tabindex="0" role="button" aria-label="${revealed ? "정답이 공개됨" : "정답 공개"}">
            <div class="card-top">
              <span class="source">LEXIQUE ${card.lexique} · ${card.number}</span>
              <span class="streak" aria-label="연속 정답 ${p.streak}회">${[0,1,2].map(i => `<span class="dot${i < p.streak ? " on" : ""}"></span>`).join("")}</span>
            </div>
            <div class="prompt-wrap">
              <div>
                <div class="direction-label">${directionLabel}</div>
                <div class="prompt${reverse ? " korean" : ""}">${escapeHtml(prompt)}</div>
                ${reverse && missingKorean ? '<div class="hint-missing">PDF에 한국어 뜻이 없어 영어 원문을 제시함</div>' : ""}
                ${!reverse ? '<button class="pronounce-btn" id="pronounceBtn" type="button" aria-label="프랑스어 발음 듣기">🔊 발음 듣기</button>' : ""}
              </div>
            </div>
            <div class="answer" aria-hidden="${!revealed}">
              <div class="answer-main${reverse ? " french" : ""}">${escapeHtml(answer)}</div>
              ${card.en && !(reverse && missingKorean) ? `<div class="answer-en">${escapeHtml(card.en)}</div>` : ""}
              ${!reverse && missingKorean ? '<div class="answer-note">PDF 원문에 한국어 뜻이 기재되지 않음</div>' : ""}
              ${reverse ? '<button class="pronounce-btn" id="pronounceBtn" type="button" aria-label="프랑스어 발음 듣기">🔊 발음 듣기</button>' : ""}
            </div>
          </article>
          <div class="actions${revealed ? " revealed-actions" : ""}" id="actions">
            <button class="reveal-btn" id="revealBtn" type="button">정답 보기</button>
            <div class="grade-row">
              <button class="grade wrong" id="wrongBtn" type="button">X 모름<small>${state.mode === "hard" ? "3장 뒤 다시" : "10장 뒤 다시"}</small></button>
              <button class="grade right" id="rightBtn" type="button">O 앎<small>${p.streak === 2 ? "완료 처리" : "뒤로 보내기"}</small></button>
            </div>
          </div>
          <p class="shortcut">Space: 정답 · ← X · → O</p>
        </div>`;
    }

    function emptyMarkup() {
      let title = "이 범위를 완료했어요";
      let message = "연속 3회 맞힌 카드는 완료 처리됩니다.";
      let button = "전체 500개 보기";
      let action = "all";
      if (state.mode === "hard" && scopeCards().length === 0) {
        title = "아직 어려운 카드가 없어요";
        message = "X를 누른 카드가 여기에 모입니다.";
      } else if (state.mode === "session" && state.session < 20) {
        title = `세션 ${state.session} 완료`;
        message = "좋습니다. 다음 25개로 바로 이어가세요.";
        button = "다음 세션 시작";
        action = "next";
      }
      return `<section class="empty"><div class="empty-icon">✓</div><h2>${title}</h2><p>${message}</p><button class="next-btn" data-action="${action}" type="button">${button}</button></section>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
    }

    function render() {
      const queue = getQueue();
      renderStats();
      renderControls();
      if (!queue.length) {
        main.innerHTML = emptyMarkup();
        const next = main.querySelector(".next-btn");
        if (next) bindTap(next, () => {
          if (next.dataset.action === "next") { state.session += 1; state.mode = "session"; }
          else state.mode = "all";
          revealed = false; save(); render();
        });
        save();
        return;
      }
      const card = CARDS.find(item => item.id === queue[0]);
      main.innerHTML = cardMarkup(card, queue.length);
      bindTap($("#flashcard"), reveal);
      $("#flashcard").addEventListener("keydown", event => {
        if ((event.key === "Enter" || event.key === " ") && !revealed) { event.preventDefault(); reveal(); }
      });
      bindTap($("#revealBtn"), event => { event.stopPropagation(); reveal(); });
      bindTap($("#wrongBtn"), event => { event.stopPropagation(); grade(false); });
      bindTap($("#rightBtn"), event => { event.stopPropagation(); grade(true); });
      bindTap($("#pronounceBtn"), event => {
        event.stopPropagation();
        pronounce(card.fr, card.id);
      });
      save();
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      $("#flashcard")?.classList.add("revealed");
      $("#actions")?.classList.add("revealed-actions");
      $("#flashcard .answer")?.setAttribute("aria-hidden", "false");
      $("#wrongBtn")?.focus();
    }

    function availableFrenchVoices() {
      if (!("speechSynthesis" in window)) return [];
      return window.speechSynthesis.getVoices().filter(voice => {
        const language = (voice.lang || "").toLowerCase();
        return language === "fr-fr" || language.startsWith("fr-fr-") || language === "fr";
      });
    }

    function pronounce(text, cardId) {
      const spokenText = text.replace(/\s*\([fm]\.\)/gi, "").replace(/\s{2,}/g, " ").trim();
      playHostedFrench(cardId, spokenText);
    }

    function playHostedFrench(cardId, spokenText) {
      if (onlineFrenchAudio) {
        onlineFrenchAudio.pause();
        onlineFrenchAudio = null;
      }
      const audio = new Audio(`audio/${encodeURIComponent(cardId)}.mp3`);
      let fallbackStarted = false;
      const fallback = () => {
        if (fallbackStarted) return;
        fallbackStarted = true;
        playNativeOrOnlineFrench(spokenText);
      };
      onlineFrenchAudio = audio;
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
    }

    function playNativeOrOnlineFrench(spokenText) {
      if (!("speechSynthesis" in window)) {
        playOnlineFrench(spokenText);
        return;
      }
      const voices = availableFrenchVoices();
      const franceVoice = voices.find(voice => (voice.lang || "").toLowerCase() === "fr-fr") || voices[0];
      if (!franceVoice) {
        playOnlineFrench(spokenText);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = "fr-FR";
      utterance.voice = franceVoice;
      utterance.rate = 0.84;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function playOnlineFrench(text) {
      if (onlineFrenchAudio) {
        onlineFrenchAudio.pause();
        onlineFrenchAudio = null;
      }
      // Google Translate의 표준 프랑스어(fr) 음성: 캐나다 프랑스어(fr-CA)는 요청하지 않음.
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fr&q=${encodeURIComponent(text)}`;
      const audio = new Audio(url);
      onlineFrenchAudio = audio;
      audio.addEventListener("error", () => showToast("온라인 발음을 재생하지 못했어요. 인터넷 연결을 확인해 주세요."), { once: true });
      audio.play().catch(() => showToast("온라인 발음을 재생하지 못했어요. 인터넷 연결을 확인해 주세요."));
    }

    function grade(correct) {
      if (!revealed) return;
      const queue = getQueue();
      const id = queue.shift();
      const p = progressOf(id);
      if (correct) {
        p.o += 1; p.streak += 1; state.daily.o += 1;
        if (p.streak < MASTERY) {
          const delay = p.streak === 1 ? 12 : 18;
          queue.splice(Math.min(delay, queue.length), 0, id);
        } else showToast("완료! 연속 3회 정답");
      } else {
        p.x += 1; p.streak = 0;
        if (!state.daily.wrongIds.includes(id)) state.daily.wrongIds.push(id);
        state.daily.x = state.daily.wrongIds.length;
        const delay = state.mode === "hard" ? 3 : 10;
        queue.splice(Math.min(delay, queue.length), 0, id);
      }
      setQueue(queue);
      revealed = false;
      save();
      render();
    }

    function renderHardList() {
      const hard = CARDS
        .filter(card => wrongTotal(card.id) > 0)
        .sort((a, b) => wrongTotal(b.id) - wrongTotal(a.id) || a.lexique - b.lexique || a.number - b.number);
      $("#hardList").innerHTML = hard.length ? hard.map(card => `
        <div class="hard-row">
          <div><div class="hard-fr">${escapeHtml(card.fr)}</div><div class="hard-ko">${escapeHtml(card.ko || card.en)} · L${card.lexique}-${card.number}</div></div>
          <div class="hard-count">X ${wrongTotal(card.id)}</div>
        </div>`).join("") : '<div class="modal-empty">X를 누른 카드가 아직 없습니다.</div>';
    }

    for (let i = 1; i <= 20; i += 1) {
      const start = (i - 1) * 25 + 1;
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `${i}세션 · ${start}-${start + 24}`;
      $("#sessionSelect").appendChild(option);
    }

    const chooseMode = event => {
      const btn = event.target.closest(".mode-btn");
      if (!btn) return;
      state.mode = btn.dataset.mode;
      revealed = false; save(); render();
    };
    $("#modeTabs").addEventListener("click", chooseMode);
    $("#modeTabs").addEventListener("touchend", event => { event.preventDefault(); chooseMode(event); }, { passive: false });
    $("#sessionSelect").addEventListener("change", event => {
      state.session = Number(event.target.value);
      revealed = false; save(); render();
    });
    bindTap($("#directionBtn"), () => {
      state.direction = state.direction === "fr-ko" ? "ko-fr" : "fr-ko";
      revealed = false; save(); render(); showToast(state.direction === "fr-ko" ? "프랑스어 → 한국어" : "한국어 → 프랑스어");
    });
    bindTap($("#resetBtn"), () => {
      if (!confirm("모든 학습 기록과 어려운 카드 목록을 초기화할까요?")) return;
      state = freshState();
      revealed = false; save(); render(); showToast("전체 기록을 초기화했습니다.");
    });
    bindTap($("#hardBtn"), () => { renderHardList(); $("#hardDialog").showModal(); });
    bindTap($("#closeHardBtn"), () => $("#hardDialog").close());
    $("#hardDialog").addEventListener("click", event => { if (event.target === $("#hardDialog")) $("#hardDialog").close(); });
    bindTap($("#studyHardBtn"), () => { $("#hardDialog").close(); state.mode = "hard"; revealed = false; save(); render(); });
    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener?.("voiceschanged", () => window.speechSynthesis.getVoices());
    }
    window.addEventListener("keydown", event => {
      if ($("#hardDialog").open) return;
      if (event.code === "Space" && !revealed) { event.preventDefault(); reveal(); }
      else if (revealed && (event.key === "ArrowLeft" || event.key.toLowerCase() === "x")) { event.preventDefault(); grade(false); }
      else if (revealed && (event.key === "ArrowRight" || event.key.toLowerCase() === "o")) { event.preventDefault(); grade(true); }
    });

    render();
  </script>
</body>
</html>
