let lastTap=0,lastWord=null;
function toggleWord(el,word,gloss){
  const now=Date.now();
  if(lastWord===word&&now-lastTap<350){ // double tap -> show meaning
    toast(gloss?word+' = '+gloss:'이 단어의 뜻은 자료에 없어요');
    lastTap=0;lastWord=null;return;

  lastTap=now;lastWord=word;

      const key=word;
      if(red.has(key)){red.delete(key);document.querySelectorAll('[data-w="'+CSS.escape(key)+'"]').forEach(e=>e.classList.remove('red'));}

    const sel=document.querySelector('.choice[data-q="'+q.n+'"].sel');
    document.querySelectorAll('.choice[data-q="'+q.n+'"]').forEach((x,i)=>{
      x.classList.toggle('ok',i===q.answer);x.classList.toggle('no',sel&&+sel.dataset.i===i&&i!==q.answer);});
    const a=document.getElementById('ans'+q.n);
    a.innerHTML='정답: <b>'+htmlEsc(q.choices[q.answer])+'</b><br>'+htmlEsc(q.expl)
      +(sel?(+sel.dataset.i===q.answer?' <b style="color:#16a34a">⭕ 맞았어요!</b>':' <b style="color:#dc2626">❌ 다시 보세요</b>'):'');
    a.classList.add('show');
  }));
}
function findTok(el){
  const qn=el.closest('.card').id.replace('q','');
  const q=DATA.find(x=>x.n==qn);if(!q)return '';
  for(const toks of q.paras)for(const t of toks)if(t.t==='w'&&t.x===el.dataset.w&&t.g)return t.g;
  return '';
}
function htmlEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function attrEsc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
document.getElementById('fab').addEventListener('click',()=>{
  const list=document.getElementById('redList');
  list.innerHTML=[...red].map(([w,g])=>'<div class="rw"><b>'+htmlEsc(w)+'</b>'+(g?' — '+htmlEsc(g):' <span style="color:#999">(뜻 미등록)</span>')+'</div>').join('')||'<div style="color:#999">아직 표시한 단어가 없어요</div>';
  document.getElementById('panel').classList.add('show');
});
document.getElementById('closePanel').addEventListener('click',()=>document.getElementById('panel').classList.remove('show'));
document.getElementById('clearRed').addEventListener('click',()=>{red.clear();save();render();
  document.getElementById('panel').classList.remove('show');});
let speakingQn=null,sayAudio=null;
function frenchVoices(){try{return speechSynthesis.getVoices().filter(v=>{const l=(v.lang||'').toLowerCase();return l==='fr-fr'||l.indexOf('fr-fr-')===0||l==='fr';});}catch(e){return[];}}
function sayStop(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
  if(sayAudio){try{sayAudio.pause();}catch(e){}sayAudio=null;}speakingQn=null;refreshSayBtns();}
function refreshSayBtns(){document.querySelectorAll('[data-say]').forEach(b=>{const on=speakingQn!==null&&+b.dataset.say===speakingQn;
  b.classList.toggle('on',on);b.textContent=on?'⏹ 듣기 중지':'🔊 지문 듣기';});}
function questionText(qn){const q=DATA.find(x=>x.n==qn);if(!q)return'';
  return q.paras.map(toks=>toks.map(t=>t.x).join('')).join(' ').replace(/\s+/g,' ').trim();}
function chunkText(t){const parts=t.split(/(?<=[.!?…])\s+/);const out=[];let cur='';
  for(const p of parts){if((cur+' '+p).trim().length>180){if(cur)out.push(cur.trim());cur=p;}else cur=(cur+' '+p).trim();}
  if(cur.trim())out.push(cur.trim());return out.length?out:[' '];}
function sayQuestion(btn){const qn=+btn.dataset.say;
  if(speakingQn===qn){sayStop();return;}
  sayStop();
  const text=questionText(qn);
  if(!text){toast('읽을 지문이 없어요');return;}
  speakingQn=qn;refreshSayBtns();
  const done=()=>{if(speakingQn===qn){speakingQn=null;refreshSayBtns();}};
  if('speechSynthesis' in window){
    const vs=frenchVoices();const v=vs.find(x=>(x.lang||'').toLowerCase()==='fr-fr')||vs[0];
    if(v){try{speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.voice=v;u.rate=0.9;
      u.onend=done;u.onerror=done;speechSynthesis.speak(u);return;}catch(e){}}
  }
  const chunks=chunkText(text);let i=0;
  const next=()=>{if(speakingQn!==qn)return;
    if(i>=chunks.length){done();return;}
    const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fr&q='+encodeURIComponent(chunks[i++]);
    try{const a=new Audio(url);sayAudio=a;a.onended=next;
      a.onerror=()=>{toast('온라인 발음을 재생하지 못했어요');done();};
      const r=a.play();if(r&&r.catch)r.catch(()=>{toast('온라인 발음을 재생하지 못했어요');done();});
    }catch(e){toast('온라인 발음을 재생하지 못했어요');done();}};
  next();}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();
  if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',()=>speechSynthesis.getVoices());}catch(e){}}
render();save();
</script></body></html>
